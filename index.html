
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="manifest.json">
  <title>はじめてのPWA</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      font-family: sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }
    main {
      max-width: 480px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
    }
    h1 { font-size: 24px; }
    p { color: #64748b; }
    form { display: flex; gap: 8px; }
    input {
      min-width: 0;
      flex: 1;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    ul { padding: 0; list-style: none; }
    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #e2e8f0;
      overflow-wrap: anywhere;
    }
    li span { flex: 1; }
    li.done span {
      text-decoration: line-through;
      color: #94a3b8;
    }
    li button { padding: 8px 10px; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>はじめてのPWA</h1>
    <p>小さなタスクを登録して、ひとつずつ完了しよう。</p>

    <form id="taskForm">
      <input id="taskInput" placeholder="例：水を飲む" required>
      <button type="submit">追加</button>
    </form>

    <ul id="taskList"></ul>
    <p id="count">未完了：0件</p>
  </main>

  <script>
    const form = document.getElementById("taskForm");
    const input = document.getElementById("taskInput");
    const list = document.getElementById("taskList");
    const count = document.getElementById("count");
    let tasks = [];

    function render() {
      list.replaceChildren();

      tasks.forEach((task, index) => {
        const item = document.createElement("li");
        if (task.done) item.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.setAttribute("aria-label", task.text + "を完了");
        checkbox.addEventListener("change", () => {
          tasks[index].done = checkbox.checked;
          render();
        });

        const text = document.createElement("span");
        text.textContent = task.text;

        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "削除";
        remove.addEventListener("click", () => {
          tasks.splice(index, 1);
          render();
        });

        item.append(checkbox, text, remove);
        list.append(item);
      });

      count.textContent =
        "未完了：" + tasks.filter(task => !task.done).length + "件";
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      tasks.push({ text, done: false });
      input.value = "";
      render();
    });
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .then(() => console.log("Service Worker 登録成功"))
          .catch(error => console.error("登録失敗:", error));
      });
    }
  </script>  
</body>
</html>
